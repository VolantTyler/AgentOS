# Post AI news digests to Slack when they land on main.
#
# Covers the scheduled daily path (after auto-merge) and any other merge that
# adds docs/research/ai-news-YYYY-MM-DD.md.
#
# Required repo secret: SLACK_AI_NEWS_WEBHOOK_URL
# Manual test: Actions → Notify AI news Slack → Run workflow

name: Notify AI news Slack

on:
  push:
    branches: [main]
    paths:
      - "docs/research/ai-news-*.md"
  workflow_dispatch:
    inputs:
      digest_path:
        description: Digest path under repo root (e.g. docs/research/ai-news-2026-08-08.md)
        required: true
        type: string

concurrency:
  group: notify-ai-news-slack
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve digest paths
        id: digests
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PATH: ${{ github.event.inputs.digest_path }}
        run: |
          set -euo pipefail
          paths=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "${MANUAL_PATH:-}" ]; then
              echo "digest_path is required for workflow_dispatch"
              exit 1
            fi
            paths+=("$MANUAL_PATH")
          else
            # Prefer the files changed on this push; fall back to empty.
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              if [[ "$file" =~ ^docs/research/ai-news-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$ ]]; then
                paths+=("$file")
              fi
            done < <(git diff --name-only --diff-filter=AM HEAD~1 HEAD || true)
          fi

          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No ai-news digest files to notify; exiting."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${paths[@]}" > /tmp/ai-news-digests.txt
          echo "count=${#paths[@]}" >> "$GITHUB_OUTPUT"
          echo "Resolved digests:"
          cat /tmp/ai-news-digests.txt

      - name: Post to Slack
        if: steps.digests.outputs.count != '0' && steps.digests.outputs.count != ''
        env:
          SLACK_AI_NEWS_WEBHOOK_URL: ${{ secrets.SLACK_AI_NEWS_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/ai-news-digests.txt ]; then
            echo "No digest list; nothing to post."
            exit 0
          fi
          while IFS= read -r file; do
            echo "Notifying Slack for $file"
            npm run notify:ai-news -- --required "$file"
          done < /tmp/ai-news-digests.txt
